<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">How Agency Signage works</title>
  <desc id="desc">One Raspberry Pi on the local network stores screens, photos, and accounts. Staff edit in a browser. Displays open a screen URL and talk only to the Pi.</desc>
  <rect width="980" height="460" rx="18" fill="#0c2340"/>
  <text x="40" y="48" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="28" font-weight="650">One Pi on the local network</text>
  <text x="40" y="78" fill="#c4a35a" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16">Pages, photos, and accounts stay on that machine</text>

  <rect x="40" y="120" width="250" height="210" rx="14" fill="#16345a" stroke="#c4a35a" stroke-width="2"/>
  <text x="165" y="168" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="20" font-weight="650">Admin browser</text>
  <text x="165" y="202" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15">Sign in at /admin</text>
  <text x="165" y="228" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15">Edit a draft</text>
  <text x="165" y="254" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15">Publish when ready</text>
  <text x="165" y="292" text-anchor="middle" fill="#c4a35a" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="14">Editors and admins</text>

  <rect x="365" y="100" width="250" height="250" rx="14" fill="#08182e" stroke="#e6c98a" stroke-width="3"/>
  <text x="490" y="150" text-anchor="middle" fill="#e6c98a" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="22" font-weight="700">Raspberry Pi</text>
  <text x="490" y="186" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="16">Agency Signage</text>
  <text x="490" y="220" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15">SQLite database</text>
  <text x="490" y="246" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15">Photo library</text>
  <text x="490" y="272" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15">Accounts</text>
  <text x="490" y="312" text-anchor="middle" fill="#c4a35a" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="14">https://signage.local</text>

  <rect x="690" y="120" width="250" height="210" rx="14" fill="#16345a" stroke="#c4a35a" stroke-width="2"/>
  <text x="815" y="168" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="20" font-weight="650">Displays</text>
  <text x="815" y="202" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15">TV, Pi, or tablet</text>
  <text x="815" y="228" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15">Opens /screen/name</text>
  <text x="815" y="254" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15">Checks for updates</text>
  <text x="815" y="292" text-anchor="middle" fill="#c4a35a" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="14">No outside calls</text>

  <path d="M290 210 H355" stroke="#e6c98a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M615 210 H680" stroke="#e6c98a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="322" y="198" text-anchor="middle" fill="#e6c98a" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="13">edit</text>
  <text x="648" y="198" text-anchor="middle" fill="#e6c98a" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="13">show</text>

  <rect x="250" y="380" width="480" height="52" rx="10" fill="#08182e" stroke="#3d5a7a"/>
  <text x="490" y="412" text-anchor="middle" fill="#f4efe4" font-family="Segoe UI, Liberation Sans, sans-serif" font-size="15">Weather is optional. The Pi asks, and hides it if the reading is missing.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#e6c98a"/>
    </marker>
  </defs>
</svg>
